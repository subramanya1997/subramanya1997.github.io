name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: URL parity gate
        # The frozen Jekyll-era manifest is the URL contract: the build must
        # serve every indexed URL with no canonical drift.
        run: node scripts/parity/diff-manifests.mjs scripts/parity/manifest.json out

      - name: Run content validation
        run: node scripts/validate-content.mjs

      - name: Run API output validation
        run: python3 scripts/validate_api_output.py out
