name: Update Analytics Data

on:
  schedule:
    # Run daily at 5 PM PST (1 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-analytics-data google-auth

      - name: Fetch Analytics Data
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
        run: |
          python scripts/fetch_analytics.py

      # Pushing to main triggers the git-connected Vercel deployment automatically.
      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add content/data/view_count.json
          if git diff --staged --quiet; then
            echo "No analytics changes to commit."
          else
            git commit -m "Update view count data"
            git push
          fi
