name: Loop submission PR

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-loop-pr:
    if: contains(github.event.issue.body, 'LOOP_SUBMISSION_MARKDOWN_START')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare loop file
        id: prepare
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const issue = event.issue;
          const body = String(issue.body ?? "");
          const title = String(issue.title ?? "").replace(/^Loop submission:\s*/i, "").trim();

          function slugify(value) {
            const slug = String(value)
              .toLowerCase()
              .replace(/['"]/g, "")
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "");
            return slug === "" ? "submitted-loop" : slug.slice(0, 80).replace(/-+$/, "");
          }

          let filename = (body.match(/<!-- LOOP_SUBMISSION_FILENAME:\s*([^>]+?)\s*-->/)?.[1] ?? "").trim();
          if (filename === "") filename = `${slugify(title)}.md`;
          filename = path.basename(filename).toLowerCase().replace(/[^a-z0-9._-]/g, "-");
          if (!filename.endsWith(".md")) filename = `${filename}.md`;

          const match = body.match(/<!-- LOOP_SUBMISSION_MARKDOWN_START -->\s*([\s\S]*?)\s*<!-- LOOP_SUBMISSION_MARKDOWN_END -->/);
          if (!match) throw new Error("Missing loop submission markdown block");

          const markdown = match[1].trim();
          if (markdown === "") throw new Error("Loop submission markdown is empty");
          if (!markdown.startsWith("---")) throw new Error("Loop submission must include YAML front matter");

          fs.mkdirSync("content/loops", { recursive: true });
          fs.writeFileSync(path.join("content", "loops", filename), `${markdown}\n`);

          let branch = `loop-submission-${issue.number}-${slugify(filename.replace(/\.md$/, ""))}`;
          branch = branch.slice(0, 120).replace(/-+$/, "");

          const loopTitle = title === "" ? filename.replace(/\.md$/, "") : title;
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `branch=${branch}\nfilename=${filename}\nloop_title=${loopTitle}\n`
          );
          NODE

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Detect changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- "content/loops/${{ steps.prepare.outputs.filename }}")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit loop submission
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          FILENAME: ${{ steps.prepare.outputs.filename }}
          LOOP_TITLE: ${{ steps.prepare.outputs.loop_title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "content/loops/$FILENAME"
          git commit -m "Add loop: $LOOP_TITLE"
          git push --force-with-lease origin "$BRANCH"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LOOP_TITLE: ${{ steps.prepare.outputs.loop_title }}
        run: |
          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json url -q .url >/tmp/loop-pr-url 2>/dev/null; then
            true
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Add loop: $LOOP_TITLE" \
              --body "Created from loop submission issue #$ISSUE_NUMBER. Closes #$ISSUE_NUMBER." \
              >/tmp/loop-pr-url
          fi

          PR_URL="$(cat /tmp/loop-pr-url)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Created PR for this loop submission: $PR_URL"
