# Build and deploy the Next.js static export to GitHub Pages.
#
# IMPORTANT — this workflow does not take over deployment on its own:
#
#   1. Pages must be set to "GitHub Actions" as its source
#      (Settings → Pages → Build and deployment → Source).
#   2. The existing Jekyll deploy (.github/workflows/deploy.yml) must be
#      retired first — two workflows publishing to the same Pages site would
#      race, so the deploy job below is gated behind the repository variable
#      NEXT_PAGES_DEPLOY. Set it to "true" (Settings → Secrets and variables →
#      Actions → Variables) as the final cut-over step.
#
# Until that variable is set, pushes only build the site and run the parity
# checks — deployment keeps happening exactly as it does today.
#
# public/CNAME is synced from the repo root by scripts/next/sync-public.mjs and
# lands in out/CNAME, so the custom domain survives the switch.
name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  # Shared with the Jekyll deploy workflow so the two can never publish at once.
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build

      - name: Validate machine-readable API output
        run: python3 scripts/validate_api_output.py out

      - name: Disable Pages Jekyll post-processing
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        if: vars.NEXT_PAGES_DEPLOY == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: vars.NEXT_PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: vars.NEXT_PAGES_DEPLOY == 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
